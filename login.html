<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SADEEQ VTU - Login</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#16a34a">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a1f14, #1a3a28);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
  .container { max-width: 28rem; width: 100%; text-align: center; }
  .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
  .logo {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      margin: 0 auto 24px;
      box-shadow: 0 8px 32px rgba(22, 163, 74, 0.4);
      object-fit: cover;
      border: 2px solid #16a34a;
    }
  .h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
  .tagline {
      font-size: 18px;
      opacity: 0.9;
      margin-bottom: 4px;
      font-weight: 600;
    }
  .input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 16px;
      backdrop-filter: blur(10px);
      margin-bottom: 12px;
    }
  .input::placeholder { color: rgba(255, 255, 255, 0.7); }
  .input:focus {
      outline: none;
      border-color: #16a34a;
      background: rgba(255, 255, 255, 0.15);
    }
  .btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 16px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: block;
      margin-bottom: 12px;
    }
  .btn-primary {
      background: white;
      color: #16a34a;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
  .btn-primary:hover { transform: translateY(-2px); }
  .btn-secondary {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }
  .btn-ghost {
      background: transparent;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  .showBtn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #16a34a;
      cursor: pointer;
      font-weight: 600;
    }
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="loginLoader" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:9999;flex-direction:column;">
    <div style="width:70px;height:70px;border:6px solid #1a3a28;border-top:6px solid #16a34a;border-radius:50%;animation:spin 1s linear infinite;"></div>
    <p style="margin-top:15px">Logging in...</p>
  </div>

  <div class="container">
    <div class="glass-card">
      <img src="images/SADEEQ.PNG" class="logo" alt="Sadeeq Logo">
      <h1 class="h1">Welcome Back</h1>
      <p class="tagline">Cheap, Affordable, Fast</p>

      <input id="loginUsername" class="input" placeholder="Username or Email">

      <div style="position:relative;">
        <input id="loginPassword" type="password" class="input" placeholder="Password">
        <button class="showBtn" onclick="togglePassword()">Show</button>
      </div>

      <button id="loginBtn" class="btn btn-primary">Login</button>
<button id="biometricBtn" class="btn btn-ghost">
  🔐 Login with Fingerprint / Face ID
</button>
      <a href="signup.html" class="btn btn-secondary">Create Account</a>
    </div>
    <a href="https://wa.me/2348131375356?text=I%20forgot%20my%20password" class="btn btn-ghost">Forgot Password?</a>
  </div>

<script>
const API = "https://mayconnect-backend-1.onrender.com";

const usernameInput = document.getElementById("loginUsername");
const passwordInput = document.getElementById("loginPassword");
const loginBtn = document.getElementById("loginBtn");
const biometricBtn = document.getElementById("biometricBtn");
const loader = document.getElementById("loginLoader");
const welcomeSound = new Audio("sounds/welcome.mp3");

const NativeBiometric =
window.Capacitor?.Plugins?.NativeBiometric;

document.addEventListener("DOMContentLoaded", () => {

if (localStorage.getItem("token")) {
location.href = "dashboard.html";
}

});

function togglePassword() {

if (!passwordInput) return;

passwordInput.type =
passwordInput.type === "password"
? "text"
: "password";

}

async function login() {

const username = usernameInput.value.trim();  
const password = passwordInput.value.trim();  

if (!username || !password) {  
    alert("Saka username da password");  
    return;  
}  

loginBtn.disabled = true;  
loader.style.display = "flex";  

try {  

    const res = await fetch(API + "/api/login", {  

        method: "POST",  

        headers: {  
            "Content-Type": "application/json"  
        },  

        body: JSON.stringify({  
            username,  
            password  
        })  

    });  

    const data = await res.json();  
    console.log("LOGIN RESPONSE =", data);  

    if (!res.ok) {  
        throw new Error(data.message || "Login failed");  
    }

// Save login details
localStorage.setItem("token", data.token);
localStorage.setItem("username", data.user.username);
localStorage.setItem("userId", data.user.id);
localStorage.setItem("email", data.user.email || "");

// Save password temporarily for fingerprint setup
localStorage.setItem("biometric_password", password);

console.log("Saved username:", localStorage.getItem("username"));
console.log("Saved password:", localStorage.getItem("biometric_password"));

if (data.user.is_admin) {
alert("Welcome Admin");
}

welcomeSound.play().catch(() => {});  

    setTimeout(() => {  
        location.href = "dashboard.html";  
    }, 600);  

} catch (err) {  

    console.error(err);  

    alert(err.message || "Server error");  

    loader.style.display = "none";  
    loginBtn.disabled = false;  

}

}

loginBtn.addEventListener("click", login);

if (biometricBtn) {
biometricBtn.addEventListener(
"click",
biometricLogin
);
}

/* ================= HELPERS ================= */

function base64urlToArrayBuffer(base64url) {

if (!base64url) {  
    throw new Error("Missing base64url value");  
}  

const padding =  
    "=".repeat((4 - (base64url.length % 4)) % 4);  

const base64 =  
    (base64url + padding)  
        .replace(/-/g, "+")  
        .replace(/_/g, "/");  

const binary = atob(base64);  

const bytes = new Uint8Array(binary.length);  

for (let i = 0; i < binary.length; i++) {  
    bytes[i] = binary.charCodeAt(i);  
}  

return bytes.buffer;

}

function arrayBufferToBase64url(buffer) {

const bytes = new Uint8Array(buffer);  

let binary = "";  

for (const b of bytes) {  
    binary += String.fromCharCode(b);  
}  

return btoa(binary)  
    .replace(/\+/g, "-")  
    .replace(/\//g, "_")  
    .replace(/=/g, "");

}

async function biometricLogin() {

// ================= ANDROID APP =================
if (window.Capacitor?.isNativePlatform?.() && NativeBiometric) {

try {  

    // Show the same loader used by password login  
    loginBtn.disabled = true;  
    loader.style.display = "flex";  

    const username = localStorage.getItem("username");  

    if (!username) {  
        throw new Error("Please login normally once before using fingerprint.");  
    }  

    const server = "sadeeq-datahub-" + username;  

    const result = await NativeBiometric.isCredentialsSaved({  
        server  
    });  

    if (!result.isSaved) {  
        throw new Error("Fingerprint has not been enabled for this account.");  
    }  

    await NativeBiometric.verifyIdentity({  
        reason: "Login with Fingerprint",  
        title: "SADEEQ DATA HUB"  
    });  

    const credentials = await NativeBiometric.getCredentials({  
        server  
    });  

    const res = await fetch(API + "/api/login", {  
        method: "POST",  
        headers: {  
            "Content-Type": "application/json"  
        },  
        body: JSON.stringify({  
            username: credentials.username,  
            password: credentials.password  
        })  
    });  

    const data = await res.json();  

    if (!res.ok) {  
        throw new Error(data.message || "Login failed");  
    }  

    localStorage.setItem("token", data.token);  
    localStorage.setItem("username", data.user.username);  
    localStorage.setItem("userId", data.user.id);  
    localStorage.setItem("email", data.user.email || "");  

    // Hide loader before redirect  
    loader.style.display = "none";  

    window.location.href = "dashboard.html";  
    return;  

} catch (err) {  

    console.error(err);  

    // Hide loader if login fails  
    loader.style.display = "none";  
    loginBtn.disabled = false;  

    alert(err.message || "Biometric login failed");  
    return;  
}

}

// ================= WEBSITE (your existing code continues below) =================

try {

const res = await fetch(
API + "/api/auth/webauthn/login-start",
{
method: "POST",
credentials: "include"
}
);

const options = await res.json();

if (!res.ok) {
throw new Error(options.error || "Login start failed");
}

const publicKey = {
challenge: base64urlToArrayBuffer(
options.challenge
),
rpId: options.rpId,
timeout: options.timeout,
userVerification:
options.userVerification || "preferred"
};

if (
Array.isArray(options.allowCredentials) &&
options.allowCredentials.length > 0
) {

publicKey.allowCredentials =
options.allowCredentials.map(c => ({

type: "public-key",    

  id: base64urlToArrayBuffer(    
    String(c.id).trim()    
  ),    

  transports:    
    Array.isArray(c.transports)    
     ? c.transports    
      : ["internal", "hybrid"]    

}));

}

const credential =
await navigator.credentials.get({
publicKey
});

if (!credential) {
throw new Error("Cancelled");
}

const authRes = await fetch(
API + "/api/auth/webauthn/login-finish",
{
method: "POST",
credentials: "include",

headers: {    
  "Content-Type": "application/json"    
},    

body: JSON.stringify({    

  id: credential.id,    

  rawId:    
    arrayBufferToBase64url(    
      credential.rawId    
    ),    

  response: {    

    authenticatorData:    
      arrayBufferToBase64url(    
        credential.response.authenticatorData    
      ),    

    clientDataJSON:    
      arrayBufferToBase64url(    
        credential.response.clientDataJSON    
      ),    

    signature:    
      arrayBufferToBase64url(    
        credential.response.signature    
      ),    

    userHandle:    
      credential.response.userHandle    
       ? arrayBufferToBase64url(    
            credential.response.userHandle    
          )    
        : null    

  },    

  type: credential.type    

})

}
);

const data = await authRes.json();

if (!authRes.ok) {
throw new Error(
data.error || "Verification failed"
);
}

localStorage.setItem(

"token",
data.token
);

if (data.user) {

localStorage.setItem(
"userId",
data.user.id
);

localStorage.setItem(
"username",
data.user.username
);

localStorage.setItem(
"email",
data.user.email || ""
);

}

location.href = "dashboard.html";

}
catch (err) {

console.error(err);

}

}
</script>
</body>
</html>
